    <!-- Trunk build directives -->
    
<script type="module">
import init, * as bindings from './pdfcraft-web-745b687bacdc87f1.js';
const wasm = await init({ module_or_path: './pdfcraft-web-a18cda567322b5a8_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        background: #19191c;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }

      /* Native-like preloader screen */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #19191c;
        color: #ffffff;
        z-index: 9999;
        transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
      }
      #loading.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loading-logo {
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #12a58a;
        border-radius: 50%;
        animation: spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin-bottom: 18px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-title {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.3px;
        margin-bottom: 6px;
        color: #f3f4f6;
      }
      .loading-sub {
        font-size: 13px;
        color: #9ca3af;
      }
    </style>
  <link rel="modulepreload" href="./pdfcraft-web-745b687bacdc87f1.js" crossorigin="anonymous" integrity="sha384-vUw7SAP0CeLe+XLqUa1fK6dOLfsWxpSiblQ7Kgal7X3/k1A0spZMCB77KsiL5w0F"><link rel="preload" href="./pdfcraft-web-a18cda567322b5a8_bg.wasm" crossorigin="anonymous" integrity="sha384-IXKKfGGdoEv5v6LxjYgbDwnn5MQSEeKcpRmzj8p8CAW5+ObVpEOlM/MaAte1vwXj" as="fetch" type="application/wasm"></head>
  <body>
    <div id="loading">
      <img src="icons/icon-192.png" alt="PdfCraft" class="loading-logo" />
      <div class="spinner"></div>
      <div class="loading-title">PdfCraft</div>
      <div class="loading-sub">Caricamento PDF Workbench…</div>
    </div>
    <canvas id="pdfcraft"></canvas>

    <script>
      // Register Service Worker for offline PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.warn('PdfCraft: ServiceWorker error:', err);
          });
        });
      }

      // Fallback: dismiss loading screen after 5 seconds if not dismissed by WASM
      setTimeout(() => {
        const el = document.getElementById('loading');
        if (el) el.classList.add('loaded');
      }, 5000);
    </script>
  <script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>
</html>
